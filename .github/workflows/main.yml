name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # cancel only for pull_request runs, not push runs on main/dev

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Lint (fail, don't auto-fix, in CI)
        run: npm run lint -- --no-fix

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Typecheck backend
        run: npm run typecheck:backend
      - name: Typecheck frontend
        run: npm run typecheck:frontend
      - name: Typecheck e2e
        run: npm run typecheck:e2e
      - name: Typecheck tests
        run: npm run typecheck:tests

  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # No server needed: pure unit tests and the in-process production guard.
      - name: Run unit tests
        run: npm run test:unit
      - name: Run production guard tests (local, NODE_ENV=production in-process)
        run: npm run test:production

  backend-integration:
    name: backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      - name: Run app tests
        run: npm run test:app
      - name: Run login tests
        run: npm run test:login
      - name: Run integration tests
        run: npm run test:integration
      - name: Run production live tests (against ROOT)
        env:
          ROOT: ${{ secrets.ROOT }} # only this step needs it
        run: npm run test:production:prod

  frontend-unit:
    name: frontend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # test:react also covers a handful of specs that talk to the real dev
      # server (real login/HTTP from jsdom), so it still needs one running.
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      - name: Run react client tests
        run: npm run test:react

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      - name: Cache playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
