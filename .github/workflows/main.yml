name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: ${{ vars.NODE_ENV }}
      ROOT: ${{ secrets.ROOT }}
      KEY: ${{ secrets.KEY }}
      USER_TEST: ${{ secrets.USER_TEST }}
      MAPBOX: ${{ secrets.MAPBOX }}
      TOMTOM: ${{ secrets.TOMTOM }}

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    - run: echo "NODE_ENV = $NODE_ENV"
    - run: npm ci --legacy-peer-deps
    - run: npm run build --if-present
    - name: Start server
      run: |
        sudo NODE_ENV=$NODE_ENV KEY=$KEY USER_TEST=$USER_TEST MAPBOX=$MAPBOX TOMTOM=$TOMTOM npm start &
        sleep 16 # Give server some time to start
    - name: Check if server is running
      run: |
        curl --fail http://localhost:80 || exit 1
    - name: Run app tests
      run: npm run test:app
    - name: Run login tests
      run: npm run test:login
    - name: Run unit tests
      run: npm run test:unit
    # React client tests (vitest + jsdom). The page tests log in with the
    # dev-only TEST user, so NODE_ENV must not be production and USER_TEST
    # must be a bcrypt hash of "test". They read from the server but never
    # write entries, so they are safe to run before the integration tests.
    - name: Run react client tests
      run: npm run test:react
    - run: echo "--- base tests complete ---"
    - name: Run integration tests
      run: npm run test:integration
    # Browser E2E (playwright). Convention: clean data before e2e - the integration
    # tests fill today's data file to the 1000-entry cap, where /write silently
    # stops appending, and the e2e specs seed the entries they need themselves.
    # Locally that is npm run test:postClear; here the build is already fresh and
    # the server (running as root for port 80) owns the runtime files, so only
    # the data folder is cleared, with sudo. The server recreates it on the
    # first /write (src/scripts/file.ts).
    - name: Reset test data for e2e
      run: sudo rm -rf dist/data
    - name: Cache playwright browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install playwright browser
      run: npx playwright install --with-deps chromium
    - name: Run e2e tests
      run: npm run test:e2e
    - name: Upload playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore
    - name: Run production guard tests (local, NODE_ENV=production in-process)
      run: npm run test:production
    - name: Run production live tests (against ROOT)
      run: npm run test:production:prod
      
   
    