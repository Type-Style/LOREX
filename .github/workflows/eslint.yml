name: Lint (scheduled)

# PR/push linting now runs as the "lint" job in the Tests workflow
# (.github/workflows/main.yml), alongside the other split-out test jobs.
# This workflow keeps only the standing weekly check, so lint isn't run
# twice on every PR to dev.
on:
  schedule:
    - cron: '34 10 * * 1'

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps # or yarn install
      - name: Lint code (fail, don't auto-fix)
        run: npm run lint -- --no-fix

