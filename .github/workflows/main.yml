name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # cancel only for pull_request runs, not push runs on main/dev

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Lint (fail, don't auto-fix, in CI)
        run: npm run lint -- --no-fix

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Typecheck backend
        run: npm run typecheck:backend
      - name: Typecheck frontend
        run: npm run typecheck:frontend
      - name: Typecheck e2e
        run: npm run typecheck:e2e
      - name: Typecheck tests
        run: npm run typecheck:tests

  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # No server needed: pure unit tests and the in-process production guard.
      - name: Run unit tests
        run: npm run test:unit
      - name: Run production guard tests (local, NODE_ENV=production in-process)
        run: npm run test:production

  backend-integration:
    name: backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      - name: Run app tests
        run: npm run test:app
      - name: Run login tests
        run: npm run test:login
      # The server runs as root; create the day file as the runner so the
      # integration test can seed it directly without elevated privileges.
      - name: Prepare writable integration data file
        run: |
          mkdir -p dist/data
          printf '{"entries": []}' > "dist/data/data-$(date +%F).json"
      - name: Run integration tests
        run: npm run test:integration

  backend-production:
    name: backend production live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Run production live tests (against ROOT)
        env:
          ROOT: ${{ secrets.ROOT }} # only this step needs it
        run: npm run test:production:prod

  frontend-unit:
    name: frontend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # test:react also covers a handful of specs that talk to the real dev
      # server (real login/HTTP from jsdom), so it still needs one running.
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      - name: Run react client tests
        run: npm run test:react

  e2e:
    name: e2e (${{ matrix.project }}, ${{ matrix.suite }})
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
        suite: [general, polling]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/start-server
        with:
          node-env: ${{ vars.NODE_ENV }}
          key: ${{ secrets.KEY }}
          user-test: ${{ secrets.USER_TEST }}
          mapbox: ${{ secrets.MAPBOX }}
          tomtom: ${{ secrets.TOMTOM }}
      # The server runs as root; create the day file as the runner so E2E
      # helpers can reset it between specs without elevated privileges.
      - name: Prepare writable e2e data file
        run: |
          mkdir -p dist/data
          printf '{"entries": []}' > "dist/data/data-$(date +%F).json"
      - name: Cache playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: |
          if [ "${{ matrix.suite }}" = "polling" ]; then
            npm run test:e2e -- --project=${{ matrix.project }} --grep="@polling"
          else
            npm run test:e2e -- --project=${{ matrix.project }} --grep-invert="@polling"
          fi
      - name: Upload playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
